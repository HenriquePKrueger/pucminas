<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio-03</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <main class="container">
        
        <section class="card shadow-sm my-5">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Cadastrar Novo Produto</h5>
            </div>
            <div class="card-body">
                <form class="row g-3">
                    <div class="col-md-6">
                        <label for="descricao" class="form-label">Descrição do Produto</label>
                        <input type="text" class="form-control" id="descricao" required>
                    </div>

                    <div class="col-md-6">
                        <label for="preco" class="form-label">Preço (R$)</label>
                        <input type="text" class="form-control" id="preco" required>
                    </div>

                    <div class="col-md-6">
                        <label for="dataFabricacao" class="form-label">Data de Fabricação</label>
                        <input type="text" class="form-control" id="dataFabricacao" placeholder="2020-04-16" required>
                    </div>

                    <div class="col-md-6">
                        <label for="dataValidade" class="form-label">Data de Validade</label>
                        <input type="text" class="form-control" id="dataValidade" placeholder="2020-04-16" required>
                    </div>

                    <div class="col-12 text-end mt-4">
                        <button type="submit" class="btn btn-success px-4">
                            <i class="bi bi-check-lg"></i> Cadastrar
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <hr class="my-5">

        <section>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4">Listagem de Produtos</h2>
            </div>

            <div class="card shadow-sm">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#ID</th>
                                <th>Descrição</th>
                                <th>Preço</th>
                                <th>Fabricação</th>
                                <th>Validade</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td><strong>Exemplo</strong></td>
                                <td>1.200,00</td>
                                <td>2026-01-02</td>
                                <td>N/A</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-info text-white" title="Detalhar">
                                        <i class="bi bi-eye"></i> Detalhar
                                    </button>
                                    <button class="btn btn-sm btn-danger" title="Remover">
                                        <i class="bi bi-trash"></i> Remover
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
